name: Schema documentation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  schema-dump:
    name: Verify generated schema documentation
    runs-on: ubuntu-latest
    env:
      # Prisma requires a datasource URL while generating its client. The dump
      # reads only the checked-in schema and does not connect to this database.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/maincar2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        run: npm ci --prefix server

      - name: Generate Prisma client
        run: npm --prefix server run db:generate

      - name: Verify generated schema documentation
        run: npm run schema:dump -- --check
